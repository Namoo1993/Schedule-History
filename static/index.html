<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>PCS 스케줄 달력</title>
<style>
  :root{
    color-scheme:light;
    --bg:#ffffff; --panel:#ffffff; --ink:#111827; --muted:#5b6575;
    --line:#d8dee9; --accent:#0b4fd8; --accent-soft:#e6efff;
    --today:#fff3bf; --sun:#e11d48; --sat:#1d4ed8;
    /* 모선 색 - 색상환을 열 등분한 10가지. 일정 막대를 이 색으로 꽉 채우고
       흰 글씨를 얹으므로, 흰색과의 대비율이 모두 4.7:1 이상 나오도록
       채도는 높게 두되 밝기는 낮춰 잡았다. */
    --v1:#c81036; --v2:#c44e09; --v3:#8a5a00; --v4:#5c7a00; --v5:#0a7c45;
    --v6:#00736b; --v7:#0271a3; --v8:#0b4fd8; --v9:#7722c4; --v10:#b3166f;
    --shadow:0 1px 3px rgba(17,24,39,.10), 0 8px 24px rgba(17,24,39,.07);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",system-ui,sans-serif;
    font-size:14px; line-height:1.45;
  }
  .wrap{max-width:1500px; margin:0 auto; padding:16px;}

  /* ---- 상단 바 ---- */
  header{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  .row{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;}
  h1{font-size:17px; margin:0 12px 0 0; letter-spacing:-.2px; white-space:nowrap;}
  label.f{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
  select,input[type=search]{
    font:inherit; font-size:13px; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:6px 9px; min-height:32px;
  }
  input[type=search]{min-width:170px;}
  select:focus,input:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .seg button{
    font:inherit; font-size:13px; font-weight:700; padding:6px 14px; border:0; cursor:pointer;
    background:var(--panel); color:var(--muted); min-height:32px;
  }
  .seg button+button{border-left:1px solid var(--line);}
  .seg button[aria-pressed="true"]{background:var(--accent); color:#fff;}
  .seg.dir button{padding:6px 18px; font-size:13.5px;}
  .seg.dir button[aria-pressed="true"]{background:var(--ink);}

  .chips{display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px; margin-top:12px;
        padding-top:12px; border-top:1px solid var(--line); min-height:43px;
        scrollbar-gutter:stable;}
  .chip{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600;
  }
  .chip .n{font-weight:600;}
  .chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:#fff;}
  .chip[aria-pressed="false"]{background:var(--panel); color:var(--muted);}
  .chip[aria-pressed="false"]:hover{border-color:var(--accent); color:var(--ink);}
  .chip.err{border-style:dashed;}
  .chip.clr{color:var(--muted); font-weight:500;}
  .chip.clr:hover{border-color:var(--sun); color:var(--sun);}
  /* 조건부 버튼은 지우지 않고 투명하게만 만든다. 안 그러면 줄이 다시 접히면서
     아래 달력이 통째로 위아래로 흔들린다. */
  .ghost{visibility:hidden !important; pointer-events:none !important;}

  /* ---- 모선 고르기 ---- */
  .vbar{display:flex; align-items:flex-start; gap:10px; margin-top:10px; padding-top:10px;
        border-top:1px dashed var(--line);}
  .vbar[hidden]{display:none;}
  .vbar .lbl{flex:0 0 78px; padding-top:5px; font-size:12px; font-weight:700; color:var(--muted);
             white-space:nowrap;}
  .vbar .lbl b{color:var(--ink); font-variant-numeric:tabular-nums;}
  /* 칩이 있는 줄 수만큼만 높이를 차지한다. 항로를 여러 개 켜서 모선이 수십 개가
     되면 다섯 줄쯤에서 높이를 막고 안에서 굴린다 */
  .vchips{flex:1 1 auto; display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px;
          min-height:28px; max-height:148px; overflow-y:auto; scrollbar-gutter:stable;}
  .vchips .none{font-size:12px; color:var(--muted); padding-top:5px;}
  .vchip{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:999px; padding:3px 11px 3px 7px; font-size:12px; font-weight:600;
    max-width:100%; overflow:hidden;
  }
  .vchip i{flex:0 0 auto; width:10px; height:10px; border-radius:3px; background:var(--c,var(--muted));}
  .vchip .n{color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums;}
  .vchip:hover{border-color:var(--accent);}
  .vchip[aria-pressed="false"]{
    color:var(--muted); background:color-mix(in srgb, var(--line) 18%, transparent);
    text-decoration:line-through; text-decoration-color:var(--muted);
  }
  .vchip[aria-pressed="false"] i{opacity:.22;}
  .vchip.act{padding:3px 11px; color:var(--muted); font-weight:500; text-decoration:none;}
  .vchip.act:hover{color:var(--accent);}

  /* ---- 서비스 고르기 ---- 고른 항로에 들어 있는 서비스는 많아야 열몇 개라 높이를 낮게 둔다 */
  .vchips.svcs{max-height:76px;}
  .schip{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:999px; padding:3px 12px; font-size:12.5px; font-weight:700; letter-spacing:.4px;
    font-family:inherit;
  }
  .schip .n{font-weight:600; font-size:11.5px; opacity:.75; font-variant-numeric:tabular-nums; letter-spacing:0;}
  .schip:hover{border-color:var(--accent); color:var(--ink);}
  .schip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:#fff;}

  /* ---- 달력 ---- */
  .calbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 10px;}
  .calbar[hidden]{display:none;}
  .calbar h2{font-size:16px; margin:0; font-variant-numeric:tabular-nums;}
  .nav{display:flex; gap:6px;}
  .nav button{
    font:inherit; font-size:13px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); border-radius:8px; padding:5px 11px; cursor:pointer; min-height:30px;
  }
  .nav button:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  .nav button:disabled{opacity:.35; cursor:default;}

  table.cal{
    width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; box-shadow:var(--shadow);
  }
  table.cal th{
    font-size:12px; font-weight:700; color:var(--muted); padding:9px 6px;
    border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--line) 25%, transparent);
  }
  th.s0{color:var(--sun)} th.s6{color:var(--sat)}
  table.cal td{
    vertical-align:top; height:132px; padding:5px; border-right:1px solid var(--line);
    border-bottom:1px solid var(--line); overflow:hidden;
  }
  td:last-child{border-right:0}
  tr:last-child td{border-bottom:0}
  td.out{background:color-mix(in srgb, var(--line) 14%, transparent);}
  td.today{background:var(--today);}
  .dn{font-size:12.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; margin:1px 3px 4px;}
  td.out .dn{opacity:.4}
  td.today .dn{color:var(--ink);}
  .dn.s0{color:var(--sun)} .dn.s6{color:var(--sat)}
  .dn .badge{float:right; font-size:10px; font-weight:800; background:var(--accent); color:#fff;
    border-radius:4px; padding:0 5px; letter-spacing:.3px;}

  .ev{
    display:block; width:100%; text-align:left; font:inherit; cursor:pointer;
    border:0; border-left:4px solid color-mix(in srgb, var(--c) 72%, #000); border-radius:4px;
    background:var(--c);
    color:var(--tx,#fff); padding:3px 5px; margin-bottom:3px;
    font-size:11.5px; font-weight:700; line-height:1.32;
    white-space:normal; overflow-wrap:anywhere;
  }
  .ev:hover{filter:brightness(.92);}
  .ev .t{display:block; font-weight:600; font-size:10.5px; color:var(--tx,#fff); opacity:.82; font-variant-numeric:tabular-nums;}
  /* 출항 완료 항차도 예정 항차와 똑같은 색으로 보여준다 (상태는 상세창에서 확인) */
  .ev.done{opacity:1;}
  .ev .t b{font-weight:800;}
  .more{font-size:11px; color:var(--muted); padding:1px 5px; cursor:pointer; background:0; border:0; font-family:inherit;}

  /* ---- 상태/모달 ---- */
  .note{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:28px 20px; text-align:center; color:var(--muted); box-shadow:var(--shadow);
  }
  .note b{color:var(--ink); display:block; margin-bottom:8px; font-size:15px;}
  .note code{background:var(--accent-soft); color:var(--accent); padding:2px 7px; border-radius:5px;
    font-family:Consolas,monospace; font-size:12.5px;}
  .warn{margin-bottom:12px; padding:9px 13px; border-radius:9px; font-size:12.5px;
    background:color-mix(in srgb, var(--r3) 15%, transparent); border:1px solid var(--r3); color:var(--ink);}

  dialog{
    border:1px solid var(--line); border-radius:14px; padding:0; max-width:540px; width:calc(100% - 32px);
    background:var(--panel); color:var(--ink); box-shadow:var(--shadow);
  }
  dialog::backdrop{background:rgba(10,15,25,.45);}
  .dh{padding:15px 18px; border-bottom:1px solid var(--line); border-top:4px solid var(--c); border-radius:11px 11px 0 0;}
  .dh h3{margin:0; font-size:17px; letter-spacing:-.2px;}
  .dh h3 .vvd{color:var(--muted); font-weight:500; font-size:14px; letter-spacing:0;}
  .dh p{margin:6px 0 0; font-size:12.5px; color:var(--muted);}
  .dh p:empty{display:none;}
  /* Off-hire / Guaranteed 표시 (icon_hire.py 판정) */
  .hire{display:inline-block; font-size:12px; font-weight:800; letter-spacing:.2px;
        padding:2px 10px; border-radius:999px;}
  .hire.off{background:#fde4e7; color:#b4142e;}
  .hire.ok{background:#dcf3e6; color:#0a6b3c;}
  .db{padding:6px 18px 16px;}
  .db dl{display:grid; grid-template-columns:86px 1fr; gap:9px 12px; margin:12px 0 0; font-size:13px;}
  .db dt{color:var(--muted); font-size:12px; padding-top:1px;}
  .db dd{margin:0; font-weight:600; font-variant-numeric:tabular-nums;}
  .db footer{margin-top:18px; display:flex; justify-content:flex-end; gap:8px;}

  /* ---- 실적 ---- */
  /* 나라·항구가 많은 항차는 표가 길어지므로 창 안에서 굴린다 */
  .act{max-height:62vh; overflow-y:auto;}
  .act table{width:100%; border-collapse:collapse; margin-top:12px; font-size:13px;
             font-variant-numeric:tabular-nums;}
  .act th{font-size:11.5px; font-weight:700; color:var(--muted); text-align:right;
          padding:6px 8px; border-bottom:1px solid var(--line);}
  .act th:first-child,.act th:nth-child(2){text-align:left;}
  .act td{padding:7px 8px; border-bottom:1px solid var(--line); text-align:right; font-weight:600;}
  .act td.pol,.act td.pod{text-align:left;}
  .act td.pol{font-weight:800; vertical-align:top;}
  .act tr.grp td{border-top:2px solid var(--line);}
  .act .msg{margin:14px 0 2px; font-size:13px; color:var(--muted); text-align:center;}
  /* POL 합계는 옅은 파랑, 전체 합계는 진한 남색으로 구분 */
  .act tr.sub td{font-weight:800; background:var(--accent-soft); color:var(--accent);}
  .act tr.tot td{border:0; font-weight:800; background:var(--ink); color:#fff;}

  .db footer button{font:inherit; font-size:13px; padding:7px 18px; border-radius:8px;
    border:1px solid var(--line); background:var(--accent); color:#fff; cursor:pointer; font-weight:600;}
  /* 실적 창의 '스케줄 보기' 버튼은 왼쪽에 보조 버튼 모양으로 */
  .db footer button.sec{margin-right:auto; background:var(--panel); color:var(--ink);}
  .db footer button.sec:hover{border-color:var(--accent); color:var(--accent);}
  /* dl 에 display:grid 가 걸려 있어 hidden 속성만으로는 안 숨겨진다 */
  .db [hidden]{display:none !important;}

  /* ---- 좁은 화면용 목록 ---- */
  .list{background:var(--panel); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); overflow:hidden;}
  .day{display:flex; gap:11px; padding:10px 12px; border-bottom:1px solid var(--line);}
  .day:last-child{border-bottom:0}
  .day.today{background:var(--today);}
  .day .d{flex:0 0 52px; text-align:center; padding-top:2px;}
  .day .d .num{display:block; font-size:19px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums;}
  .day .d .dw{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
  .day.s0 .d .num{color:var(--sun)} .day.s6 .d .num{color:var(--sat)}
  .day .items{flex:1 1 auto; min-width:0;}
  .day .items .ev{font-size:13px; padding:6px 9px; margin-bottom:5px; border-left-width:4px;}
  .day .items .ev:last-child{margin-bottom:0}
  .day .items .ev .t{font-size:11.5px;}

  @media (max-width:860px){
    .wrap{padding:16px 12px;}
    /* 제목에 nowrap 이 걸려 있어 수집 시각 문구가 길면 화면 밖으로 밀려나
       가로 스크롤이 생겼다. 좁은 화면에서는 줄바꿈을 허용한다. */
    h1{width:100%; white-space:normal;}
    .calbar{flex-wrap:wrap}
    .vbar{flex-wrap:wrap; gap:6px}
    .vbar .lbl{flex:1 1 100%; padding-top:0}
    .vchips{max-height:180px}
    .row{gap:10px 12px}
    label.f{flex:1 1 auto}
    select,input[type=search]{flex:1 1 auto; min-width:0}
  }
  /* ---- 사이트 비밀번호 ---- */
  .lock{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
        background:var(--bg); padding:16px;}
  .lock[hidden]{display:none;}
  .lock form{width:100%; max-width:320px; border:1px solid var(--line); border-radius:12px;
             background:var(--panel); padding:22px 20px; display:flex; flex-direction:column; gap:10px;}
  .lock h1{margin:0 0 4px; font-size:17px;}
  .lock input{font:inherit; font-size:15px; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
              color:var(--ink); background:var(--panel);}
  .lock button{font:inherit; font-weight:700; padding:9px; border:0; border-radius:8px;
               background:var(--accent); color:#fff; cursor:pointer;}
  .lock .msg{min-height:18px; margin:0; font-size:12.5px; color:#c62828;}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <form id="lockForm" autocomplete="off">
    <h1>PCS 스케줄 달력</h1>
    <input type="password" id="lockPw" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button type="submit">들어가기</button>
    <p class="msg" id="lockMsg"></p>
  </form>
</div>
<div class="wrap">

<header>
  <div class="row">
    <h1>PCS 스케줄 달력</h1>

    <div class="seg dir" role="group" aria-label="수출/수입">
      <button id="btnIM" aria-pressed="true">수입</button>
      <button id="btnEX" aria-pressed="false">수출</button>
    </div>

    <label class="f">조회 날짜
      <select id="selDate"></select>
    </label>

    <div class="seg" role="group" aria-label="오전/오후">
      <button id="btnAM" aria-pressed="false">오전</button>
      <button id="btnPM" aria-pressed="false">오후</button>
    </div>

    <label class="f"><span id="lblCountry">출발 지역</span>
      <select id="selCountry"></select>
    </label>

    <label class="f">기준
      <select id="selBasis">
        <option value="etd">출항일 (ETD)</option>
        <option value="eta">도착일 (ETA)</option>
      </select>
    </label>

    <label class="f">모선명
      <input type="search" id="q" list="vesselList" autocomplete="off"
             placeholder="예: PEGASUS TERA">
      <datalist id="vesselList"></datalist>
    </label>
  </div>
  <div class="chips" id="chips"></div>
  <div class="vbar" id="sbar" hidden>
    <span class="lbl">서비스 <b id="sCount"></b></span>
    <div class="vchips svcs" id="schips"></div>
  </div>
  <div class="vbar" id="vbar" hidden>
    <span class="lbl">모선 <b id="vCount"></b></span>
    <div class="vchips" id="vchips"></div>
  </div>
</header>

<div id="warn"></div>

<div class="calbar" id="calbar" hidden>
  <h2 id="monthTitle"></h2>
  <div class="nav">
    <button id="prev">◀ 이전달</button>
    <button id="todayBtn">오늘</button>
    <button id="next">다음달 ▶</button>
  </div>
</div>

<div id="view"></div>

<dialog id="dlg">
  <div class="dh" id="dh"><h3 id="dTitle"></h3><p id="dSub"></p></div>
  <div class="db">
    <div class="act" id="dAct" hidden></div>
    <dl id="dList"></dl>
    <footer><button id="dSched" class="sec" hidden>스케줄 보기</button><button id="dClose">닫기</button></footer>
  </div>
</dialog>

</div>

<script>
const VCOLORS = ["var(--v1)","var(--v2)","var(--v3)","var(--v4)","var(--v5)",
                 "var(--v6)","var(--v7)","var(--v8)","var(--v9)","var(--v10)"];

// 모선명으로 색을 정한다. 항차(뒤 숫자)는 보지 않으므로
// PEGASUS GLORY 2621E 와 PEGASUS GLORY 2622E 는 같은 색이 된다.
//
// 열 가지를 다 쓰고 나면 같은 색을 다시 쓰되 명도를 바꿔 구분한다.
//   1바퀴: 기본 / 2바퀴: 진하게 / 3바퀴: 흐리게
// 흐린 단계는 흰 글씨로 읽히지 않으므로 글자색까지 같이 넘긴다.
function vesselStyle(i){
  const base = VCOLORS[i % VCOLORS.length];
  switch(Math.floor(i / VCOLORS.length) % 3){
    case 0:  return { c: base, tx: "#fff" };
    case 1:  return { c: `color-mix(in srgb, ${base} 65%, #000)`, tx: "#fff" };
    default: return { c: `color-mix(in srgb, ${base} 45%, #fff)`, tx: "#10151d" };
  }
}
const DOW = ["일","월","화","수","목","금","토"];
// UN/LOCODE 앞 두 자리로 상대 국가를 가른다. 없는 코드는 그대로 보여준다.
const COUNTRY = {
  CN:"중국", JP:"일본", HK:"홍콩", TW:"대만", IN:"인도", BD:"방글라데시",
  LK:"스리랑카", KR:"한국", RU:"러시아", US:"미국", AE:"아랍에미리트",
  SEA:"동남아",
};
// 동남아는 나라별로 쪼개지 않고 한 덩어리로 본다.
const SEA_COUNTRY = new Set(["VN","TH","HK","SG","MY","ID","PH","KH","MM"]);
// 중국 코드지만 항로 성격이 동남아 쪽인 항구들.
const SEA_PORT = new Set(["CNSHK","CNXMN"]);
const $ = s => document.querySelector(s);

let snapshots = [];      // 저장된 스냅샷 목록
let hire = {};           // 항차별 Off-hire / Guaranteed 판정 {VVD:{status,delay,port,...}}
let snap = null;         // 현재 표시 중인 스냅샷
let session = "AM";
let basis = "etd";
let shown = new Set();   // 달력에 표시할 항로 index (비어 있으면 아무것도 표시 안 함)
let cursor = null;       // 보고 있는 달 {y, m}
let country = null;      // 칩 목록에 보여줄 상대 국가 (null 이면 첫 국가로 정한다)
let shownS = new Set();  // 켜 둔 서비스(노선코드). 비어 있으면 달력에 아무것도 안 나온다.
let hiddenV = new Set(); // 달력에서 숨겨 둔 모선명. 비어 있으면 전부 보인다.
let dirn = "IM";         // 보고 있는 방향. IM=수입(해외->한국), EX=수출(한국->해외)

// 한국 쪽이 도착지면 수입, 출발지면 수출. 스냅샷에 방향이 기록돼 있지 않아도
// 구간 코드만으로 판정되므로 예전에 수집한 자료도 그대로 읽힌다.
const isKR = c => (c || "").slice(0,2).toUpperCase() === "KR";
const dirOf = r => isKR(r.pol) ? "EX" : (isKR(r.pod) ? "IM" : "ETC");
// 국가 드롭다운은 언제나 '상대 국가' 기준으로 본다 (수출이면 도착지 쪽).
const foreignPort = r => (dirOf(r) === "EX" ? r.pod : r.pol).toUpperCase();
const foreignOf = r => {
  const port = foreignPort(r);
  const cc = port.slice(0,2);
  return (SEA_PORT.has(port) || SEA_COUNTRY.has(cc)) ? "SEA" : cc;
};
const inDir = r => dirOf(r) === dirn;

const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const routeKey = r => `${r.pol}→${r.pod}`;
// 서비스명 = 모선 일정의 노선코드(ISS, NCK ...). 비어 있는 일정은 한데 모아 둔다.
const svcOf = v => v.route || "기타";

// 로컬 뷰어(server.py)면 /api/* 를 쓰고, GitHub Pages 처럼 서버가 없으면
// 같은 폴더의 data/*.json 을 직접 읽는다.
async function getJSON(apiPath, staticPath){
  try{
    const r = await fetch(apiPath, {cache:"no-store"});
    if(r.ok) return await r.json();
  }catch(e){ /* 정적 호스팅 */ }
  // 뷰어 서버가 꺼졌거나 파일을 직접 열었으면 여기서도 실패한다. 예외를 넘기면
  // 부르는 쪽 화면이 '불러오는 중' 에서 멈추므로 null 로 돌려준다.
  try{
    const r2 = await fetch(staticPath, {cache:"no-store"});
    if(!r2.ok) return null;
    const j = await r2.json();
    // GitHub Pages 에는 암호화된 파일만 올라가 있다 (encrypt_site.py)
    return (j && j.iv && j.ct) ? await decryptJSON(j) : j;
  }catch(e){ return null; }
}

// 비밀번호 없는 공개 사이트(/public/)는 스케줄만 보여준다. 배포할 때 이 줄을 true 로
// 바꿔서 올린다(.github/workflows). 공개 쪽에는 실적·Off-hire 파일이 아예 없다.
const PUBLIC_VIEW = false;

// ---------- 사이트 비밀번호 ----------
// 저장소와 사이트가 공개라서 데이터는 비밀번호로 암호화해 올린다(AES-GCM, 키는
// PBKDF2). 한 번 맞게 넣으면 이 기기·브라우저에 키를 기억해서 다시 묻지 않는다.
let siteKey = null;
const KEY_STORE = "pcsSiteKey";
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function decryptJSON(obj){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(obj.iv)}, siteKey, unb64(obj.ct));
  const gz = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(gz).text());
}

async function unlock(){
  // 로컬 뷰어(server.py)는 평문을 주므로 비밀번호가 필요 없다
  try{ if((await fetch("/api/snapshots", {cache:"no-store"})).ok) return; }catch(e){}
  let meta, probe;
  try{
    meta = await (await fetch("./data/key.json", {cache:"no-store"})).json();
    probe = await (await fetch("./data/index.json", {cache:"no-store"})).json();
  }catch(e){ return; }   // 암호화되지 않은 배포본
  if(!(probe && probe.iv && probe.ct)) return;

  const tryKey = async raw => {
    try{
      siteKey = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      await decryptJSON(probe);
      return true;
    }catch(e){ siteKey = null; return false; }
  };
  let saved = null;
  try{ saved = localStorage.getItem(KEY_STORE); }catch(e){}
  if(saved && await tryKey(unb64(saved))) return;

  const box = $("#lock"), inp = $("#lockPw"), msg = $("#lockMsg");
  box.hidden = false;
  inp.focus();
  return new Promise(resolve => {
    $("#lockForm").onsubmit = async ev => {
      ev.preventDefault();
      msg.textContent = "";
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(inp.value), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits(
        {name:"PBKDF2", hash:"SHA-256", salt:unb64(meta.salt), iterations:meta.iter}, base, 256);
      if(await tryKey(bits)){
        try{ localStorage.setItem(KEY_STORE, tob64(bits)); }catch(e){}
        box.hidden = true;
        resolve();
      }else{
        msg.textContent = "비밀번호가 맞지 않습니다.";
        inp.select();
      }
    };
  });
}

// ---------- 초기 로드 ----------
async function init(){
  snapshots = await getJSON("/api/snapshots", "./data/index.json") || [];
  hire = PUBLIC_VIEW ? {} : await getJSON("/api/hire", "./data/hire.json") || {};

  if(!snapshots.length){
    $("#view").innerHTML = `<div class="note"><b>아직 수집된 데이터가 없습니다.</b>
      자동 수집이 한 번 돌고 나면 여기에 달력이 표시됩니다.<br>
      로컬에서 직접 받으려면 <code>run_scrape.bat</code> 을 실행하세요.</div>`;
    return;
  }

  const dates = [...new Set(snapshots.map(s=>s.date))];
  $("#selDate").innerHTML = dates.map(d=>`<option value="${d}">${d.replace(/-/g,".")}</option>`).join("");

  const latest = snapshots[0];
  $("#selDate").value = latest.date;
  session = latest.session;
  await load();
}

function availSessions(date){
  return new Set(snapshots.filter(s=>s.date===date).map(s=>s.session));
}

// ---------- 표시 기간 ----------
// 달력은 스냅샷 날짜 기준 전달 ~ 다음달만 보여준다.
const shiftYM = (ym, k) => {
  const d = new Date(+ym.slice(0,4), +ym.slice(5,7) - 1 + k, 1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
};
const inRange = (date, s) => {
  const ym = date.slice(0,7), cur = s.date.slice(0,7);
  return ym >= shiftYM(cur, -1) && ym <= shiftYM(cur, 1);
};

// 수집기는 매월 10일까지만 전달을 조회한다. 그 뒤 스냅샷에는 전달 모선이 없으므로,
// 전달이 들어 있던 마지막 스냅샷(보통 그달 10일 이전 마지막 수집분)에서 가져와 합친다.
const snapCache = new Map();
async function fetchSnap(date, session){
  const k = `${date}_${session}`;
  if(!snapCache.has(k))
    snapCache.set(k, await getJSON(`/api/snapshot?date=${date}&session=${session}`, `./data/${k}.json`));
  return snapCache.get(k);
}
async function fillPrevMonth(s){
  const pm = shiftYM(s.date.slice(0,7), -1);
  const has = x => x.routes.some(r => (r.vessels||[]).some(v => (v.etd_date||"").startsWith(pm)));
  s.prevFrom = null;
  if(has(s)) return;
  const me = `${s.date}_${s.session}`;
  for(const c of snapshots){            // 최신순
    if(`${c.date}_${c.session}` >= me || c.date < `${pm}-01`) continue;
    const o = await fetchSnap(c.date, c.session);
    if(!o || o.error || !has(o)) continue;
    const byKey = new Map(o.routes.filter(r => r.ok).map(r => [routeKey(r), r]));
    s.routes.forEach(r => {
      const old = byKey.get(routeKey(r));
      if(!old) return;
      const seen = new Set(r.vessels.map(v => `${v.vslvoy}|${v.etd}`));
      old.vessels.forEach(v => {
        if((v.etd_date||"").startsWith(pm) && !seen.has(`${v.vslvoy}|${v.etd}`)) r.vessels.push(v);
      });
    });
    s.prevFrom = o.snapshot;
    return;
  }
}

// ---------- 스냅샷 불러오기 ----------
async function load(){
  const date = $("#selDate").value;
  const avail = availSessions(date);
  if(!avail.has(session)) session = avail.has("AM") ? "AM" : "PM";

  $("#btnAM").setAttribute("aria-pressed", session==="AM");
  $("#btnPM").setAttribute("aria-pressed", session==="PM");
  $("#btnAM").disabled = !avail.has("AM");
  $("#btnPM").disabled = !avail.has("PM");
  $("#btnAM").style.opacity = avail.has("AM") ? 1 : .4;
  $("#btnPM").style.opacity = avail.has("PM") ? 1 : .4;

  const got = await getJSON(`/api/snapshot?date=${date}&session=${session}`,
                            `./data/${date}_${session}.json`);
  if(!got || got.error){
    snap = null;
    $("#view").innerHTML = `<div class="note"><b>해당 시간대 데이터가 없습니다.</b>${date} ${session==="AM"?"오전":"오후"} 수집 기록이 없습니다.</div>`;
    $("#calbar").hidden = true; $("#chips").innerHTML=""; $("#warn").innerHTML="";
    $("#sbar").hidden = true;   // 달력 자체가 없는 상태라 필터 줄도 함께 접는다
    $("#vbar").hidden = true;
    return;
  }
  // 오전/오후나 날짜를 바꿔도 골라 둔 항로는 그대로 유지한다.
  // shown 에는 항로 순번이 들어 있는데, 스냅샷마다 순번이 같다는 보장이 없으므로
  // 구간 이름(출발→도착)으로 옮겨 적었다가 새 스냅샷에서 같은 구간을 다시 찾는다.
  const keep = snap ? new Set([...shown].map(i => routeKey(snap.routes[i]))) : null;

  snap = got;
  await fillPrevMonth(snap);
  shown.clear();
  if(keep) snap.routes.forEach((r,i) => { if(keep.has(routeKey(r))) shown.add(i); });
  $("#q").value = "";
  // 모선명 자동완성 목록. 같은 모선이 여러 구간에 있어도 이름은 하나만 넣는다.
  const names = new Set();
  snap.routes.forEach(r => r.ok && r.vessels.forEach(v => v.vessel && names.add(v.vessel)));
  $("#vesselList").innerHTML =
    [...names].sort().map(v => `<option value="${esc(v)}"></option>`).join("");
  cursor = null;
  render();
}

// 방향 탭. 그 방향의 구간이 아예 없는 스냅샷이면 눌리지 않게 막는다.
// (예전에 수집한 자료에는 수입 구간밖에 없다)
function syncDirTabs(){
  const has = d => snap.routes.some(r => dirOf(r) === d);
  if(!has(dirn)) dirn = has("IM") ? "IM" : (has("EX") ? "EX" : dirn);
  $("#lblCountry").textContent = dirn === "EX" ? "도착 지역" : "출발 지역";
  [["#btnIM","IM"],["#btnEX","EX"]].forEach(([sel,d])=>{
    const el = $(sel);
    el.setAttribute("aria-pressed", dirn === d);
    el.disabled = !has(d);
    el.style.opacity = has(d) ? 1 : .4;
    el.title = has(d) ? "" : "이 스냅샷에는 해당 방향 구간이 없습니다";
  });
}

// 상대 국가 목록을 스냅샷에서 뽑아 채운다. 항로 구성이 바뀔 때만 다시 만든다.
function syncCountrySelect(){
  const codes = [...new Set(snap.routes.filter(inDir).map(foreignOf))];
  const el = $("#selCountry"), sig = dirn + ":" + codes.join(",");
  if(el.dataset.sig !== sig){
    el.dataset.sig = sig;
    el.innerHTML = codes.map(c=>`<option value="${c}">${COUNTRY[c]||c}</option>`).join("")
                 + `<option value="ALL">전체</option>`;
  }
  if(country !== "ALL" && !codes.includes(country)) country = codes[0] || "ALL";
  el.value = country;
}

// ---------- 화면 그리기 ----------
function render(){
  if(!snap) return;
  // 페이지를 내려 둔 상태에서 칩을 눌러 달력이 짧아지면 브라우저가 스크롤을 맨 위로
  // 끌어올린다. 내려 둔 동안은 페이지 높이를 줄이지 않고, 맨 위에 있을 때만 풀어 준다.
  const pageY = window.scrollY;
  document.body.style.minHeight = pageY > 0 ? document.documentElement.scrollHeight + "px" : "";
  syncDirTabs();
  syncCountrySelect();

  // 항로 칩 - 고른 국가의 항로만 보여준다.
  // 다만 이미 선택해 둔 항로는 다른 국가라도 계속 보여준다. 그러지 않으면
  // 달력에는 떠 있는데 끄는 방법이 안 보이는 상태가 된다.
  const vis = snap.routes.map((_,i)=>i).filter(i => inDir(snap.routes[i]) &&
    (country === "ALL" || foreignOf(snap.routes[i]) === country || shown.has(i)));

  $("#chips").innerHTML = vis.map(i=>{
    const r = snap.routes[i];
    const on = shown.has(i);
    const st = r.ok ? "" : `<span class="n">조회실패</span>`;
    return `<button class="chip${r.ok?"":" err"}" data-i="${i}" aria-pressed="${on}">
      ${routeKey(r)}${st}</button>`;
  }).join("")
  + `<button class="chip clr${vis.some(i => shown.has(i)) ? "" : " ghost"}" id="clrSel">선택 해제</button>`;

  const clr = vis.some(i => shown.has(i)) ? $("#clrSel") : null;
  // 다른 방향 탭의 선택까지 말없이 지우면 탭을 옮겼을 때 당황스럽다.
  if(clr) clr.onclick = () => {
    snap.routes.forEach((r,i)=>{ if(inDir(r)) shown.delete(i); });
    render();
  };

  $("#chips").querySelectorAll(".chip[data-i]").forEach(b=>{
    b.onclick = () => {
      const i = +b.dataset.i;
      if(shown.has(i)){ shown.delete(i); render(); return; }
      // 항로를 켜면 그 항로의 서비스와 모선을 전부 켠 상태로 시작한다.
      shown.add(i);
      const r = snap.routes[i];
      if(r.ok) r.vessels.forEach(v => { shownS.add(svcOf(v)); hiddenV.delete(v.vessel); });
      render();
    };
  });

  // 경고 (실패 항로 / 비로그인)
  const bad = snap.routes.filter(r=>!r.ok);
  let w = "";
  if(bad.length) w += `<div class="warn">조회에 실패한 항로가 있습니다 — ${bad.map(r=>`${routeKey(r)} (${r.error||"원인 미상"})`).join(", ")}</div>`;
  if(snap.logged_in === false) w += `<div class="warn">이 데이터는 <b>비로그인 상태</b>로 수집되었습니다${snap.login_error ? ` — ${snap.login_error}` : ""}.</div>`;
  $("#warn").innerHTML = w;

  // 항로에서 뽑은 전체 일정(all) → 켜 둔 서비스의 일정(inSvc) → 숨긴 모선을 덜어낸 것(events)
  // 순서로 좁혀서 달력에 그린다. 색은 all 기준으로 배정돼 있으므로 서비스나 모선을
  // 껐다 켜도 같은 모선의 색이 흔들리지 않는다.
  const all = collect();
  const services = [...new Set(all.map(svcOf))].sort();
  syncServiceChips(all, services);
  const inSvc = all.filter(e => shownS.has(svcOf(e)));
  const vessels = [...new Set(inSvc.map(e => e.vessel))].sort();
  syncVesselChips(inSvc, vessels, services.length > 0);
  const events = inSvc.filter(e => !hiddenV.has(e.vessel));

  if(cursor === null){
    // 오늘이 포함된 달, 없으면 데이터가 있는 첫 달
    const t = new Date();
    const months = [...new Set(events.map(e=>e.date.slice(0,7)))].sort();
    const tk = `${t.getFullYear()}-${pad(t.getMonth()+1)}`;
    const pick = months.includes(tk) ? tk : (months[0] || tk);
    cursor = {y:+pick.slice(0,4), m:+pick.slice(5,7)};
  }
  drawCalendar(events, inSvc.length > 0 && events.length === 0,
               all.length > 0 && inSvc.length === 0);
  if(pageY > 0) window.scrollTo(0, pageY);
}

// 칩 칸을 다시 그려도 칸 안 스크롤 위치를 지킨다. 칸이나 페이지를 내려 둔 상태면
// 칸 높이도 그대로 묶어 두고, 둘 다 맨 위에 있을 때만 칩 줄 수에 맞춰 높이가 다시 정해진다.
function keepScroll(box, draw){
  const top = box.scrollTop, h = box.offsetHeight;
  if(top > 0 || window.scrollY > 0) box.style.height = h + "px";
  else box.style.height = "";
  draw();
  box.scrollTop = top;
}

// 고른 항로에 들어 있는 서비스(노선코드)를 칩으로 만든다. 여러 개를 함께 켤 수 있고,
// 켠 서비스의 모선만 아래 모선 줄과 달력에 나온다.
function syncServiceChips(all, services){
  const bar = $("#sbar"), box = $("#schips");
  bar.hidden = false;   // 모선 줄과 마찬가지로 자리를 지켜 달력이 흔들리지 않게 한다
  if(!services.length){
    $("#sCount").textContent = "0";
    keepScroll(box, () => box.innerHTML = `<span class="none">항로를 선택하면 서비스가 여기에 표시됩니다.</span>`);
    return;
  }

  const cnt = new Map();
  all.forEach(e => cnt.set(svcOf(e), (cnt.get(svcOf(e))||0)+1));
  const on = services.filter(s => shownS.has(s)).length;
  $("#sCount").textContent = on ? `${on}/${services.length}` : services.length;

  keepScroll(box, () => box.innerHTML = services.map(s => {
    const p = shownS.has(s);
    return `<button class="schip" data-s="${esc(s)}" aria-pressed="${p}"
              title="${esc(s)} · ${cnt.get(s)}항차 (누르면 ${p?"끄기":"켜기"})">${esc(s)}</button>`;
  }).join("")
  + `<button class="vchip act${on < services.length ? "" : " ghost"}" id="sAll">전체 보기</button>`
  + `<button class="vchip act${on ? "" : " ghost"}" id="sNone">전체 숨기기</button>`);

  box.querySelectorAll(".schip[data-s]").forEach(b => {
    b.onclick = () => {
      const s = b.dataset.s;
      shownS.has(s) ? shownS.delete(s) : shownS.add(s);
      render();
    };
  });
  // 지금 목록에 있는 서비스만 건드린다. 꺼 둔 항로 쪽 선택까지 말없이 바꾸지 않는다.
  const a = (on < services.length) ? $("#sAll") : null, n = on ? $("#sNone") : null;
  if(a) a.onclick = () => { services.forEach(s => shownS.add(s)); render(); };
  if(n) n.onclick = () => { services.forEach(s => shownS.delete(s)); render(); };
}

// 켜 둔 서비스의 모선을 칩으로 만든다. 누르면 그 모선만 달력에서 빠진다.
// 기본값은 '전부 보임' 이라 서비스를 새로 켜서 모선이 늘어도 저절로 같이 보인다.
function syncVesselChips(all, vessels, hasSvc){
  const bar = $("#vbar"), box = $("#vchips");
  // 예전에는 모선이 없으면 이 줄을 통째로 감췄는데, 그때마다 아래 달력이 위로
  // 솟았다가 내려왔다. 이제는 항상 자리를 지키고 안내 문구만 바꾼다.
  bar.hidden = false;
  if(!vessels.length){
    $("#vCount").textContent = "0";
    keepScroll(box, () => box.innerHTML = `<span class="none">${hasSvc ? "서비스를 선택하면" : "항로와 서비스를 선택하면"} 모선이 여기에 표시됩니다.</span>`);
    return;
  }

  const cnt = new Map(), col = new Map();
  all.forEach(e => { cnt.set(e.vessel, (cnt.get(e.vessel)||0)+1); col.set(e.vessel, e.color); });
  const off = vessels.filter(v => hiddenV.has(v)).length;
  $("#vCount").textContent = off ? `${vessels.length - off}/${vessels.length}` : vessels.length;

  keepScroll(box, () => box.innerHTML = vessels.map(v => {
    const on = !hiddenV.has(v);
    return `<button class="vchip" data-v="${esc(v)}" aria-pressed="${on}"
              title="${esc(v)} · ${cnt.get(v)}항차 (누르면 ${on?"숨김":"표시"})">
              <i style="--c:${col.get(v)}"></i>${esc(v)}<span class="n">${cnt.get(v)}</span></button>`;
  }).join("")
  + `<button class="vchip act${off ? "" : " ghost"}" id="vAll">전체 보기</button>`
  + `<button class="vchip act${off < vessels.length ? "" : " ghost"}" id="vNone">전체 숨기기</button>`);

  box.querySelectorAll(".vchip[data-v]").forEach(b => {
    b.onclick = () => {
      const v = b.dataset.v;
      hiddenV.has(v) ? hiddenV.delete(v) : hiddenV.add(v);
      render();
    };
  });
  // '전체' 버튼은 지금 목록에 있는 모선만 건드린다. 다른 항로에서 꺼 둔 모선까지
  // 말없이 되살리면 항로를 다시 켰을 때 당황스럽다.
  const a = off ? $("#vAll") : null, n = (off < vessels.length) ? $("#vNone") : null;
  if(a) a.onclick = () => { vessels.forEach(v => hiddenV.delete(v)); render(); };
  if(n) n.onclick = () => { vessels.forEach(v => hiddenV.add(v)); render(); };
}

// 표시 대상 이벤트 모으기
function collect(){
  const q = $("#q").value.trim().toUpperCase();
  const out = [];
  snap.routes.forEach((r,i)=>{
    if(!shown.has(i) || !r.ok || !inDir(r)) return;
    r.vessels.forEach(v=>{
      const date = basis==="etd" ? v.etd_date : v.eta_date;
      if(!date || !inRange(date, snap)) return;
      if(q && !v.label.toUpperCase().includes(q)) return;
      out.push({...v, date, ri:i, routeLabel:routeKey(r)});
    });
  });
  out.sort((a,b)=> (a.etd||"").localeCompare(b.etd||"") || a.label.localeCompare(b.label));

  // 지금 화면에 나올 모선들에만 색을 배정한다. 이름순으로 고정해 두어야
  // 달을 넘기거나 항로를 더 켜도 같은 모선의 색이 흔들리지 않는다.
  const names = [...new Set(out.map(e => e.vessel))].sort();
  const idx = new Map(names.map((v,k) => [v,k]));
  out.forEach(e => {
    const st = vesselStyle(idx.get(e.vessel));
    e.color = st.c; e.textColor = st.tx;
  });
  return out;
}

const isNarrow = () => window.innerWidth < 760;

// 좁은 화면(휴대폰)에서는 격자 대신 날짜별 목록으로 보여준다.
function drawList(events, byDate, todayKey){
  const {y,m} = cursor;
  const days = Object.keys(byDate).filter(d => d.startsWith(`${y}-${pad(m)}`)).sort();
  if(!days.length){
    $("#view").innerHTML = `<div class="note"><b>${y}년 ${m}월에는 스케줄이 없습니다.</b>다른 달을 확인해 보세요.</div>`;
    return;
  }
  $("#view").innerHTML = `<div class="list">` + days.map(key=>{
    const dt = new Date(+key.slice(0,4), +key.slice(5,7)-1, +key.slice(8,10));
    const w = dt.getDay();
    return `<div class="day s${w}${key===todayKey?" today":""}">
      <div class="d"><span class="num">${dt.getDate()}</span><span class="dw">${DOW[w]}</span></div>
      <div class="items">${byDate[key].map(e=>{
        const t = (basis==="etd"? e.etd : e.eta) || "";
        return `<button class="ev${e.upcoming===false?" done":""}" style="--c:${e.color};--tx:${e.textColor}"
                  data-k="${e.vslvoy}|${e.etd}|${e.ri}">${e.label}
                  <span class="t">${t.slice(11)} · ${e.routeLabel}${hireTag(e)}</span></button>`;
      }).join("")}</div></div>`;
  }).join("") + `</div>`;
}

function drawCalendar(events, allHidden, noSvc){
  $("#calbar").hidden = false;
  const {y,m} = cursor;
  $("#monthTitle").textContent = `${y}년 ${m}월`;

  const byDate = {};
  events.forEach(e => (byDate[e.date] ||= []).push(e));

  const months = [...new Set(events.map(e=>e.date.slice(0,7)))].sort();
  const cur = `${y}-${pad(m)}`;
  $("#prev").disabled = !months.some(x => x < cur);
  $("#next").disabled = !months.some(x => x > cur);

  const first = new Date(y, m-1, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const todayKey = (()=>{const t=new Date(); return ymd(t.getFullYear(), t.getMonth()+1, t.getDate());})();

  if(!events.length){
    $("#calbar").hidden = true;
    const q = $("#q").value.trim();
    // 찾는 모선이 반대 방향 탭에 있는 경우가 흔하다. 그냥 '없다' 고만 하면
    // 수집이 안 된 줄 알기 쉬우므로 어느 탭에 있는지 짚어준다.
    const other = dirn === "IM" ? "EX" : "IM";
    const otherName = other === "IM" ? "수입" : "수출";
    const inOther = q && snap.routes.filter(r =>
      r.ok && dirOf(r) === other &&
      r.vessels.some(v => v.label.toUpperCase().includes(q.toUpperCase()))).length;

    $("#view").innerHTML =
      allHidden     ? `<div class="note"><b>모선을 전부 숨겼습니다.</b>위 <b>모선</b> 줄에서 보고 싶은 모선을 누르거나 <b>전체 보기</b> 를 눌러 주세요.</div>`
      : q           ? `<div class="note"><b>'${esc(q)}' 에 해당하는 모선이 ${dirn==="IM"?"수입":"수출"} 구간에 없습니다.</b>` +
                      (inOther ? `${otherName} 탭에 ${inOther}개 구간이 있습니다. 위의 <b>${otherName}</b> 을 눌러 보세요.`
                               : `모선명을 다시 확인해 보세요. 입력칸을 누르면 수집된 모선명 목록이 나옵니다.`) + `</div>`
      : !snap.routes.some(inDir)
                    ? `<div class="note"><b>이 스냅샷에는 ${dirn==="IM"?"수입":"수출"} 구간이 없습니다.</b>양방향 수집 이전에 받은 자료입니다. 다른 날짜를 선택해 보세요.</div>`
      : shown.size === 0
                    ? `<div class="note"><b>보고 싶은 항로를 선택하세요.</b>위의 항로 버튼을 누르면 그 구간의 서비스 목록이 나옵니다.</div>`
      : noSvc       ? `<div class="note"><b>서비스를 전부 숨겼습니다.</b>위 <b>서비스</b> 줄에서 보고 싶은 서비스를 누르거나 <b>전체 보기</b> 를 눌러 주세요.</div>`
                    : `<div class="note"><b>표시할 모선이 없습니다.</b>선택한 항로에 이 달의 스케줄이 없습니다.</div>`;
    return;
  }

  if(isNarrow()){
    drawList(events, byDate, todayKey);
    bindEvents(events, byDate);
    return;
  }

  let html = "<table class='cal'><thead><tr>" +
    DOW.map((d,i)=>`<th class="s${i}">${d}</th>`).join("") + "</tr></thead><tbody>";

  const cell = new Date(start);
  for(let w=0; w<6; w++){
    // 남은 주가 전부 이전/다음 달이면 그리지 않는다
    if(w>=4){
      const probe = new Date(cell);
      let inMonth = false;
      for(let i=0;i<7;i++){ if(probe.getMonth()===m-1) inMonth = true; probe.setDate(probe.getDate()+1); }
      if(!inMonth) break;
    }
    html += "<tr>";
    for(let i=0;i<7;i++){
      const key = ymd(cell.getFullYear(), cell.getMonth()+1, cell.getDate());
      const out = cell.getMonth() !== m-1;
      const isToday = key === todayKey;
      const list = byDate[key] || [];
      html += `<td class="${out?"out ":""}${isToday?"today":""}">`;
      html += `<div class="dn s${i}">${cell.getDate()}${isToday?'<span class="badge">TODAY</span>':""}</div>`;
      list.slice(0,4).forEach(e=>{
        const t = (basis==="etd"? e.etd : e.eta) || "";
        html += `<button class="ev${e.upcoming===false?" done":""}" style="--c:${e.color};--tx:${e.textColor}" data-k="${e.vslvoy}|${e.etd}|${e.ri}"
                   title="${e.label} / ${e.route}\n${e.pol_name} → ${e.pod_name}">
                   ${e.label} <span class="t">${t.slice(11)}${hireTag(e)}</span></button>`;
      });
      if(list.length>4) html += `<button class="more" data-d="${key}">+${list.length-4}건 더보기</button>`;
      html += "</td>";
      cell.setDate(cell.getDate()+1);
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  $("#view").innerHTML = html;
  bindEvents(events, byDate);
}

function bindEvents(events, byDate){
  $("#view").querySelectorAll(".ev").forEach(b=>{
    b.onclick = () => {
      const [vslvoy, etd, ri] = b.dataset.k.split("|");
      const e = events.find(x=>x.vslvoy===vslvoy && x.etd===etd && String(x.ri)===ri);
      if(e) openVessel(e);
    };
  });
  $("#view").querySelectorAll(".more").forEach(b=>{
    b.onclick = () => {
      const td = b.closest("td");
      byDate[b.dataset.d].slice(4).forEach(e=>{
        const t=(basis==="etd"? e.etd : e.eta)||"";
        const el=document.createElement("button");
        el.className="ev"+(e.upcoming===false?" done":"");
        el.style.setProperty("--c", e.color); el.style.setProperty("--tx", e.textColor);
        el.innerHTML=`${e.label} <span class="t">${t.slice(11)}${hireTag(e)}</span>`;
        el.title=`${e.label} / ${e.route}\n${e.pol_name} → ${e.pod_name}`;
        el.onclick=()=>openVessel(e);
        td.insertBefore(el, b);
      });
      b.remove();
    };
  });
}

// 달력 칸의 시각 옆에 붙이는 Off-hire / Guaranteed 판정 (판정이 없으면 비움)

// ---------- 실적 ----------
// 수입·수출 구간 모선은 실적을, 그 밖은 스케줄 상세를 보여준다.
const openVessel = e => {
  const d = dirOf(snap.routes[e.ri]);
  return !PUBLIC_VIEW && (d === "IM" || d === "EX") ? openActuals(e, d) : openDetail(e);
};

// icon_actuals.py 가 만든 항차별 합계. 수입은 data/actuals.json (POL=CN,VN,JP,TH,HK),
// 수출은 data/actuals_ex.json (POL=KR, POD 는 항구별).
const ACT_FILE = {IM: "actuals", EX: "actuals_ex"};
const actuals = {};      // {IM|EX: {updated, period, vvd:{VVD:[{pol,pod,pods,teu,amt,bl}]}}}

const fmtTEU = n => Number.isInteger(n) ? String(n) : n.toFixed(2);
const fmtRPT = (amt, teu) => teu ? (amt/teu).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}) : "-";

// 이 POL 들은 한국 POD 도 항구별로 나누지 않고 'KR' 한 줄로 합친다.
// (어느 항로에서 눌렀든 표의 POL 기준으로 적용)
const KR_GROUP_POL = new Set(["CNSHA","CNNGB","VNHPH","CNSHK","CNXMN","THLCH","THBKK","HKHKG","CNDLC","CNYNT"]);
// 예외: 이 서비스의 이 POL 은 한국 POD 를 항구별(KRPUS, KRKAN, KRINC ...)로 그대로 둔다.
const KR_SPLIT = {TP2: new Set(["CNDLC"])};

// 일본 POL 은 항구를 가리지 않고 'JP' 하나로 합친다. 같은 POD 끼리 TEU·금액을 더한다.
const polGroup = pol => pol.startsWith("JP") ? "JP" : pol;
function groupJP(lines){
  const out = [], jp = new Map();
  lines.forEach(l => {
    if(polGroup(l.pol) !== "JP") return out.push(l);
    const g = jp.get(l.pod);
    if(g){ g.teu += l.teu; g.amt += l.amt; g.bl += l.bl;
           if(l.obd && (!g.obd || l.obd < g.obd)) g.obd = l.obd; return; }
    const n = {...l, pol:"JP"};
    jp.set(l.pod, n); out.push(n);
  });
  return out;
}

function groupKR(lines, svc){
  const out = [], kr = new Map(), split = KR_SPLIT[svc];
  lines.forEach(l => {
    if(!(KR_GROUP_POL.has(l.pol) && l.pod.startsWith("KR")) || (split && split.has(l.pol))) return out.push(l);
    const g = kr.get(l.pol);
    if(g){ g.teu += l.teu; g.amt += l.amt; g.bl += l.bl; return; }
    const n = {...l, pod:"KR", teu:l.teu, amt:l.amt};
    kr.set(l.pol, n); out.push(n);   // 한국 줄은 원래 POL 묶음 맨 앞이라 자리도 그대로다
  });
  return out;
}

// 항차가 각 POL 을 떠나는 시각. 스케줄(전달 합친 것 포함)에서 찾고,
// 스케줄에 없는 POL 은 실적의 가장 이른 On Board Date(시각 없음)로 대신한다.
function polOrder(vslvoy, lines){
  const etd = new Map();
  snap.routes.forEach(r => (r.vessels||[]).forEach(v => {
    if(v.vslvoy !== vslvoy || !v.etd) return;
    const pol = polGroup(r.pol);
    if(!etd.has(pol) || v.etd < etd.get(pol)) etd.set(pol, v.etd);
  }));
  const key = new Map();
  lines.forEach(l => key.set(l.pol, etd.get(l.pol) || (l.obd ? l.obd + " 99:99" : "9999")));
  return key;
}

function actualsTable(lines, vslvoy, svc){
  lines = groupKR(groupJP(lines), svc);
  // TEU 는 줄들의 합, RPT 는 금액 합계 / TEU 합계 (줄별 RPT 의 평균이 아님)
  const sum = ls => {
    const teu = ls.reduce((a, l) => a + l.teu, 0), amt = ls.reduce((a, l) => a + l.amt, 0);
    return `<td>${fmtTEU(Math.round(teu*100)/100)}</td><td>${fmtRPT(amt, teu)}</td>`;
  };
  // 같은 POL 끼리 묶어 첫 줄에만 POL 을 적고, 묶음 끝(POL 칸 바로 아래)에 POL 합계 줄을 붙인다
  const byPol = new Map();
  lines.forEach(l => (byPol.get(l.pol) || byPol.set(l.pol, []).get(l.pol)).push(l));
  let html = `<table><thead><tr><th>POL</th><th>POD</th><th>TEU</th><th>RPT</th></tr></thead><tbody>`;
  // 먼저 출항하는 POL 이 위로
  const order = polOrder(vslvoy, lines);
  [...byPol].sort((a, b) => order.get(a[0]).localeCompare(order.get(b[0])) || a[0].localeCompare(b[0]))
            .forEach(([pol, ls]) => {
    ls.forEach((l, k) => {
      // 한국은 항구별(KRPUS), 그 밖은 나라별(RU, JP ...) 한 줄
      const pod = esc(l.pod);
      html += `<tr class="${k===0?"grp":""}">`
            + (k===0 ? `<td class="pol" rowspan="${ls.length}">${esc(pol)}</td>` : "")
            + `<td class="pod">${pod}</td><td>${fmtTEU(l.teu)}</td><td>${fmtRPT(l.amt, l.teu)}</td></tr>`;
    });
    // 줄이 하나뿐이면 합계가 그 줄과 똑같으므로 생략한다
    if(ls.length > 1) html += `<tr class="sub"><td class="pol" colspan="2">${esc(pol)} Total</td>${sum(ls)}</tr>`;
  });
  if(lines.length > 1) html += `<tr class="tot"><td class="pol" colspan="2">Total</td>${sum(lines)}</tr>`;
  return html + `</tbody></table>`;
}

function showActuals(e, act){
  const box = $("#dAct");
  // 한국→한국(KRPUS→KRINC 같은 국내 구간) 줄은 실적에서 뺀다
  const lines = (act.vvd[e.vslvoy] || []).filter(l => !(isKR(l.pol) && isKR(l.pod)));
  // 오늘 이후 출항하는 모선은 아직 실적이 없으므로 예전처럼 스케줄 상세를 보여준다.
  // (오늘 출항분도 선적 기록이 잡히기 전이면 여기로 온다)
  const today = (() => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth()+1, t.getDate()); })();
  if(!(lines && lines.length) && (e.etd_date || "") >= today) return openDetail(e);
  box.innerHTML = lines && lines.length
    ? actualsTable(lines, e.vslvoy, e.route)
    : `<div class="msg">이 항차(${esc(e.vslvoy)})의 실적이 없습니다.<br>ICON 3562 조회 결과에 이 항차의 B/L 이 없습니다.</div>`;
}

async function openActuals(e, dir){
  $("#dh").style.setProperty("--c", e.color);
  setTitle(e);
  setHire(e);
  fillDetail(e);
  $("#dList").hidden = true;
  const sb = $("#dSched");
  sb.hidden = false; sb.textContent = "스케줄 보기";
  // 실적과 스케줄을 번갈아 보여준다 (둘을 같이 띄우지 않는다)
  sb.onclick = () => {
    const show = $("#dList").hidden;
    $("#dList").hidden = !show;
    box.hidden = show;
    sb.textContent = show ? "스케줄 닫기" : "스케줄 보기";
  };
  const box = $("#dAct");
  box.hidden = false;
  if(!$("#dlg").open) $("#dlg").showModal();

  if(actuals[dir]) return showActuals(e, actuals[dir]);
  box.innerHTML = `<div class="msg">실적을 불러오는 중…</div>`;
  const f = ACT_FILE[dir];
  const got = await getJSON("/api/" + f, "./data/" + f + ".json");
  // 실적 파일은 아직 웹(GitHub)에 올리지 않으므로 웹에서는 여기로 온다.
  // 그럴 때는 예전처럼 스케줄 상세를 보여준다.
  if(!got || got.error || !got.vvd) return openDetail(e);
  actuals[dir] = got;
  showActuals(e, got);
}

// ---------- 이벤트 ----------
$("#selDate").onchange = load;
$("#btnAM").onclick = () => { session="AM"; load(); };
$("#btnPM").onclick = () => { session="PM"; load(); };
// 방향을 바꿔도 반대쪽 선택은 그대로 둔다. 돌아오면 고르던 구간이 남아 있다.
$("#btnIM").onclick = () => { dirn = "IM"; country = null; hiddenV.clear(); $("#q").value = ""; render(); };
$("#btnEX").onclick = () => { dirn = "EX"; country = null; hiddenV.clear(); $("#q").value = ""; render(); };
$("#selCountry").onchange = e => { country = e.target.value; render(); };
$("#selBasis").onchange = e => { basis = e.target.value; render(); };
// 모선명을 입력하면 그 모선이 실린 항로와 서비스를 자동으로 켠다.
// 같은 모선이 여러 구간·서비스에 걸쳐 있으면 전부 켜서 나란히 보여준다.
$("#q").oninput = () => {
  const q = $("#q").value.trim().toUpperCase();
  if(q && snap){
    shown.clear(); shownS.clear();
    snap.routes.forEach((r,i)=>{
      if(!r.ok || !inDir(r)) return;
      const hit = r.vessels.filter(v => v.label.toUpperCase().includes(q));
      if(hit.length) shown.add(i);
      hit.forEach(v => shownS.add(svcOf(v)));
    });
  }
  render();
};
$("#prev").onclick = () => { cursor.m--; if(cursor.m<1){cursor.m=12;cursor.y--;} render(); };
$("#next").onclick = () => { cursor.m++; if(cursor.m>12){cursor.m=1;cursor.y++;} render(); };
$("#todayBtn").onclick = () => { const t=new Date(); cursor={y:t.getFullYear(), m:t.getMonth()+1}; render(); };
$("#dClose").onclick = () => $("#dlg").close();

// 화면 폭이 격자/목록 경계를 넘어갈 때만 다시 그린다
let wasNarrow = isNarrow();
window.addEventListener("resize", () => {
  if(isNarrow() !== wasNarrow){ wasNarrow = isNarrow(); if(snap) render(); }
});

unlock().then(init);
</script>
