name: PCS 스케줄 뷰어 배포

# 수집은 이제 GitHub Actions 에서 하지 않는다.
#
# PCS 사이트(ebiz.pcsline.co.kr) 앞단의 Akamai 가 GitHub 러너의 IP 대역을 막아
# 'Access Denied' 를 돌려주기 때문에, 러너에서는 수집이 구조적으로 불가능하다.
# (국가 차단이 아니라 IP 평판 기반 차단. 미국/일본/싱가포르 등 일반 VPS 는 통과한다.)
#
# 그래서 수집은 사내 PC 의 작업 스케줄러가 맡고(install_task.ps1 / run_and_push.ps1),
# 수집 결과가 push 되면 이 워크플로가 화면만 다시 배포한다.

on:
  push:
    branches: [main]
  workflow_dispatch:      # 데이터 변경 없이 화면만 다시 배포하고 싶을 때

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pcs-schedule
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 배포용 폴더 구성
        run: |
          mkdir -p _site
          cp static/index.html _site/index.html
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
